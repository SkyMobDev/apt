name: publish

# Rebuilds the apt indices from scratch on every run and deploys them to Pages.
# Nothing here is incremental: the whole of dists/ is regenerated and re-signed
# each time, over .deb files downloaded from this repository's `pool` release.
# The person who promoted a version uploaded them there and recorded their
# hashes in SHA256SUMS — that is what lets this job hold no credential for the
# private repository they came from, and publish nothing but reviewed bytes.
on:
  # Merging a change to stable.list or beta.list publishes it: the review on
  # that pull request is the promotion gate, and `git revert` is the rollback.
  push:
    branches: [main]
  # A pull request runs the checks alone: no secrets, nothing deployed. A
  # promotion whose files never reached the release, or were renamed on the way,
  # fails here instead of after the merge.
  pull_request:
    branches: [main]
  workflow_dispatch:
  # The Release file carries a Valid-Until (see VALID_DAYS below); apt refuses
  # an index once it lapses, so this re-stamps and re-signs it. GitHub neither
  # retries nor backfills a missed occurrence, and it disables schedules after
  # 60 days of repository inactivity — hence a window far longer than the
  # cadence. Runs at :17 because crons on the hour are likelier to be dropped
  # under load. It re-signs the set the manifests already name, never promotes.
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # stable is what a site gets by default; beta is the canary suite a site opts
  # into by adding it to Suites:. One pool serves both.
  SUITES: stable beta
  COMPONENT: main
  ARCHS: amd64 arm64
  VALID_DAYS: "90"
  KEY_FINGERPRINT: CB088823E1472096157A7917ABEF2B3590BEB0ED
  # The release holding every .deb a manifest may name. Promote.psm1 uploads to
  # it; this workflow only reads it.
  POOL_RELEASE: pool

jobs:
  # What a pull request can be told without secrets: whether the manifests,
  # SHA256SUMS and the release agree on the files, and whether those files still
  # hash to what was reviewed.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: check the manifests, SHA256SUMS and the pool release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ./check-pool.sh

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: install apt-ftparchive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils

      - name: check the manifests, SHA256SUMS and the pool release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ./check-pool.sh

      - name: build indices
        # One pool, one index tree per suite. apt-ftparchive's `generate` takes a
        # FileList per suite and arch, which is what lets both suites name the
        # same pool/ paths instead of each needing its own copy of every .deb.
        run: |
          set -euo pipefail
          mkdir -p filelists
          for suite in $SUITES; do
            [ -f "$suite.list" ] || { echo "::error::$suite.list is missing"; exit 1; }
            for arch in $ARCHS; do
              : > "filelists/$suite-$COMPONENT-$arch"
              while read -r pkg version rest; do
                case "$pkg" in '') continue ;; esac
                echo "pool/main/$(printf %.1s "$pkg")/$pkg/${pkg}_${version}_${arch}.deb" \
                  >> "filelists/$suite-$COMPONENT-$arch"
              done < <(sed 's/#.*//; s/\r$//' "$suite.list")
              mkdir -p "dists/$suite/$COMPONENT/binary-$arch"
            done
          done

          {
            echo 'Dir { ArchiveDir "'"$PWD"'"; };'
            echo 'Default { Packages::Compress ". gzip"; };'
            for suite in $SUITES; do
              echo 'tree "dists/'"$suite"'" {'
              echo '  Sections "'"$COMPONENT"'";'
              echo '  Architectures "'"$ARCHS"'";'
              echo '  FileList "'"$PWD"'/filelists/'"$suite"'-$(SECTION)-$(ARCH)";'
              echo '};'
            done
          } > ftparchive.conf
          apt-ftparchive generate ftparchive.conf
          # generate always writes Contents files and offers no way to turn them
          # off (an empty Contents directive is ignored). Nothing here has ever
          # served apt-file, so they go before the Release step hashes them in.
          find dists -name 'Contents*' -delete

          valid=$(date -u -d "+$VALID_DAYS days" '+%a, %d %b %Y %H:%M:%S UTC')
          for suite in $SUITES; do
            # Written outside the scanned tree first: a redirect straight into
            # dists/ would let apt-ftparchive hash the half-written Release into
            # its own checksums.
            apt-ftparchive \
              -o APT::FTPArchive::Release::Origin=SkyMob \
              -o APT::FTPArchive::Release::Label=SkyMob \
              -o APT::FTPArchive::Release::Suite="$suite" \
              -o APT::FTPArchive::Release::Codename="$suite" \
              -o APT::FTPArchive::Release::Architectures="$ARCHS" \
              -o APT::FTPArchive::Release::Components="$COMPONENT" \
              -o APT::FTPArchive::Release::Description="SkyMob edge appliance packages ($suite)" \
              release "dists/$suite" > Release.tmp
            # apt-ftparchive emits no Valid-Until; without one a captured index
            # can be replayed at a stale version forever. sed exits 0 when it
            # matches nothing, so the anchor is checked rather than assumed.
            grep -q '^Date: ' Release.tmp ||
              { echo "::error::no Date: line to anchor Valid-Until to"; exit 1; }
            sed -i "/^Date: /a Valid-Until: $valid" Release.tmp
            grep -q '^Valid-Until: ' Release.tmp ||
              { echo "::error::Valid-Until was not written"; exit 1; }
            mv Release.tmp "dists/$suite/Release"
            echo "--- dists/$suite/Release ---"
            cat "dists/$suite/Release"
          done

      - name: sign
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          GNUPGHOME=$(mktemp -d); export GNUPGHOME; chmod 700 "$GNUPGHOME"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --quiet --import
          args=(--batch --yes --quiet --armor --digest-algo SHA512
                --local-user "$KEY_FINGERPRINT")
          # Supports a passphrase-protected key without requiring one: the
          # secret is optional, and an unset one leaves the loopback pinentry
          # out entirely.
          if [ -n "${APT_SIGNING_PASSPHRASE:-}" ]; then
            printf '%s' "$APT_SIGNING_PASSPHRASE" > "$GNUPGHOME/pw"
            chmod 600 "$GNUPGHOME/pw"
            args+=(--pinentry-mode loopback --passphrase-file "$GNUPGHOME/pw")
          fi
          # Both suites, every run. A canary subscribes to beta as well, and a
          # lapsed beta breaks `apt update` on exactly the machines that agreed
          # to be the ones finding problems early.
          for suite in $SUITES; do
            gpg "${args[@]}" --clearsign   -o "dists/$suite/InRelease"   "dists/$suite/Release"
            gpg "${args[@]}" --detach-sign -o "dists/$suite/Release.gpg" "dists/$suite/Release"
          done
          rm -rf "$GNUPGHOME"

      - name: assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r dists pool _site/
          cp skymob.asc CNAME _site/
          cp site/index.html _site/index.html

      - name: verify the index installs on Debian 13
        # Runs against the exact tree that deploys, on the distro we support,
        # through apt itself: a bad signature or an unsatisfiable dependency
        # fails here instead of on the appliances.
        #
        # amd64 only — this runner's architecture. The arm64 .deb is checked for
        # integrity by the download step and indexed here, but nothing installs it,
        # so arm64 dependency resolution and maintainer scripts are covered by
        # the manual VM/hardware pass in SMOKE-TEST.md and not by CI.
        #
        # Twice: once as an ordinary site on stable alone, once as a canary on
        # stable and beta together. The canary pass checks the suites coexist —
        # that adding beta to Suites: does not break resolution. It does not
        # assert which suite wins, and cannot: beta is empty most of the time.
        #
        # Each pass installs every package at once rather than one at a time.
        # These packages share an appliance, and a path two of them both ship
        # only collides when dpkg unpacks the second.
        run: |
          set -euo pipefail
          names() { sed 's/#.*//; s/\r$//' "$@" | awk 'NF { print $1 }' | sort -u; }
          stable_pkgs=$(names stable.list)
          canary_pkgs=$(names stable.list beta.list)

          verify() {
            local label="$1" suites="$2" packages="$3"
            echo "::group::$label ($suites)"
            docker run --rm -v "$PWD/_site:/site:ro" \
              -e SUITES="$suites" -e PACKAGES="$packages" \
              debian:13-slim bash -eux -c '
              install -d /etc/apt/keyrings
              cp /site/skymob.asc /etc/apt/keyrings/skymob.asc
              printf "%s\n" \
                "Types: deb" \
                "URIs: file:///site" \
                "Suites: $SUITES" \
                "Components: main" \
                "Signed-By: /etc/apt/keyrings/skymob.asc" \
                > /etc/apt/sources.list.d/skymob.sources
              apt-get update
              for pkg in $PACKAGES; do apt-cache policy "$pkg"; done
              # A real install, not --download-only: unpacking is what proves the
              # maintainer scripts run, the files land, and no two packages fight
              # over a path. systemd is not running here, so the units are
              # registered but never started — that part is the VM check.
              apt-get install -y $PACKAGES
              dpkg -l $PACKAGES
            '
            echo "::endgroup::"
          }

          verify "an ordinary site" "stable" "$stable_pkgs"
          verify "a canary"         "stable beta" "$canary_pkgs"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
