name: test

# Unit tests for Promote.psm1. They reach no repository and no release: the
# manifests under test live in a temporary git repo and every gh call is mocked,
# so this job needs no token and no secrets.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pester:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: run the tests
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path tests -CI -PassThru
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) test(s) failed" }
